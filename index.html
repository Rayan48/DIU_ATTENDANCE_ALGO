<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIU Attendance System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="bg-blue-600 text-white p-6 shadow-lg">
        <h1 class="text-3xl font-bold text-center">DIU Attendance System</h1>
        <p class="text-center mt-2 opacity-90">Google Sheets Integrated Backend</p>
    </div>

    <div class="max-w-6xl mx-auto p-4">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="bg-white p-4 rounded-lg shadow border-l-4 border-blue-500">
                <p class="text-gray-500 text-sm">Total Classes</p>
                <p id="totalClasses" class="text-2xl font-bold">0</p>
            </div>
            <div class="bg-white p-4 rounded-lg shadow border-l-4 border-green-500">
                <p class="text-gray-500 text-sm">Present Today</p>
                <p id="presentCount" class="text-2xl font-bold">0</p>
            </div>
            <div id="syncStatus" class="bg-white p-4 rounded-lg shadow border-l-4 border-yellow-500 italic text-gray-500">
                Checking Connection...
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="p-4 border-b font-bold text-gray-700">Student ID</th>
                            <th class="p-4 border-b font-bold text-gray-700">Class 1</th>
                            <th class="p-4 border-b font-bold text-gray-700">Class 2</th>
                            <th class="p-4 border-b font-bold text-gray-700">Class 3</th>
                        </tr>
                    </thead>
                    <tbody id="attendanceBody">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 1. YOUR API URL (The one you copied from Apps Script)
        const API_URL = "https://script.google.com/macros/s/AKfycby9OHceBXtcZg-2yS5tF6Yh79jMQmBDxNKWJ3gYwDFj4mHn5EW8dPi3OY8UkKxoY3op/exec";

        const state = {
            students: ["STU-001", "STU-002", "STU-003", "STU-004", "STU-005"], // Example IDs
            classes: [1, 2, 3],
            attendance: {} // Format: { classNum: { studentId: true } }
        };

        // 2. Load Data from Google Sheets
        async function syncWithSheet() {
            document.getElementById('syncStatus').innerText = "🔄 Syncing with Sheet...";
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                // Clear local state and rebuild from Sheet data
                state.attendance = {};
                data.forEach(entry => {
                    if (!state.attendance[entry.class]) state.attendance[entry.class] = {};
                    state.attendance[entry.class][entry.id] = true;
                });

                buildTable();
                updateStats();
                document.getElementById('syncStatus').innerText = "✅ Synchronized";
            } catch (err) {
                console.error("Sync Error:", err);
                document.getElementById('syncStatus').innerText = "❌ Sync Failed";
            }
        }

        // 3. Mark Attendance & Save to Sheet
        async function toggleAttendance(classNum, studentId) {
            // Prevent marking twice
            if (state.attendance[classNum]?.[studentId]) return;

            const btn = event.target;
            btn.innerText = "Saving...";
            btn.disabled = true;

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        class: classNum,
                        id: studentId,
                        status: "Present"
                    })
                });

                if (response.ok) {
                    await syncWithSheet(); // Refresh everything
                }
            } catch (err) {
                alert("Could not save to Sheet. Check connection.");
                btn.innerText = "Present";
                btn.disabled = false;
            }
        }

        function buildTable() {
            const body = document.getElementById('attendanceBody');
            body.innerHTML = state.students.map(sid => `
                <tr class="hover:bg-gray-50 transition">
                    <td class="p-4 border-b font-medium">${sid}</td>
                    ${state.classes.map(c => {
                        const isPresent = state.attendance[c]?.[sid];
                        return `
                        <td class="p-4 border-b">
                            <button 
                                onclick="toggleAttendance(${c}, '${sid}')"
                                class="px-4 py-2 rounded text-sm font-bold transition ${
                                    isPresent 
                                    ? 'bg-green-500 text-white cursor-default' 
                                    : 'bg-blue-100 text-blue-700 hover:bg-blue-600 hover:text-white'
                                }">
                                ${isPresent ? '✓ Present' : 'Mark Present'}
                            </button>
                        </td>`;
                    }).join('')}
                </tr>
            `).join('');
        }

        function updateStats() {
            document.getElementById('totalClasses').innerText = state.classes.length;
            let totalPresent = 0;
            Object.values(state.attendance).forEach(cls => {
                totalPresent += Object.keys(cls).length;
            });
            document.getElementById('presentCount').innerText = totalPresent;
        }

        // Initial Load
        syncWithSheet();
    </script>
</body>
</html>
