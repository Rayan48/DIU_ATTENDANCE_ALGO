<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIU Attendance | Persistent System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono&family=Syne:wght@700&display=swap');
        body { font-family: 'JetBrains Mono', monospace; background: #0d0f14; color: #e8ecf4; }
        .syne { font-family: 'Syne', sans-serif; }
        .id-cell { cursor: pointer; transition: 0.2s; border: 1px solid #2a2f42; }
        .id-cell:hover { background: rgba(79,142,247,0.1); }
        .present { background: #3ddc84 !important; color: #0d0f14; font-weight: bold; }
    </style>
</head>
<body class="p-4">

    <div class="max-w-7xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="syne text-4xl text-blue-400">DIU ATTENDANCE ALGO</h1>
            <p id="status" class="text-gray-500 text-sm mt-2">Checking database connection...</p>
        </header>

        <div id="setup-area" class="bg-gray-900 border border-gray-800 p-6 rounded-xl mb-6 text-center">
            <h2 class="syne mb-4">Initial Setup: Load Student IDs</h2>
            <p class="text-sm text-gray-400 mb-4">Upload your Excel file to save IDs to Google Sheets permanently.</p>
            <input type="file" id="excel-input" accept=".xlsx, .xls" class="block mx-auto text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer"/>
        </div>

        <div class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-xs text-center border-collapse">
                    <thead>
                        <tr class="bg-gray-800 text-gray-400">
                            <th class="p-3 border-r border-gray-700">Student ID</th>
                            <script>
                                for(let i=1; i<=25; i++) document.write(`<th class="p-2 border-r border-gray-700">C${i}</th>`);
                            </script>
                        </tr>
                    </thead>
                    <tbody id="attendance-body">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycby9OHceBXtcZg-2yS5tF6Yh79jMQmBDxNKWJ3gYwDFj4mHn5EW8dPi3OY8UkKxoY3op/exec";
        
        let state = {
            students: [],
            attendance: {} // { class: { id: true } }
        };

        // 1. Initial Load: Get everything from Google Sheets
        async function init() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                
                if (data.length > 0) {
                    // Extract unique IDs from the sheet to build the list
                    const uniqueIds = [...new Set(data.map(item => item.id))];
                    state.students = uniqueIds;
                    
                    // Map existing attendance
                    state.attendance = {};
                    data.forEach(entry => {
                        if (!state.attendance[entry.class]) state.attendance[entry.class] = {};
                        state.attendance[entry.class][entry.id] = true;
                    });

                    document.getElementById('setup-area').classList.add('hidden');
                    renderTable();
                    document.getElementById('status').innerText = "✅ Data synced with Google Sheets";
                } else {
                    document.getElementById('status').innerText = "⚡ System Ready: Please upload Student IDs Excel";
                }
            } catch (e) {
                document.getElementById('status').innerText = "❌ Connection Error";
            }
        }

        // 2. Handle Excel Upload (Only happens once to set up the IDs)
        document.getElementById('excel-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (evt) => {
                const bstr = evt.target.result;
                const wb = XLSX.read(bstr, {type:'binary'});
                const ws = wb.Sheets[wb.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(ws, {header:1});
                
                // Take 1st column, skip header
                const ids = rows.slice(1).map(r => r[0]).filter(id => id);
                state.students = ids;
                
                document.getElementById('setup-area').classList.add('hidden');
                renderTable();
                document.getElementById('status').innerText = "✨ IDs Loaded. Tap to mark attendance!";
            };
            reader.readAsBinaryString(file);
        });

        // 3. Mark Attendance & Push to Sheet
        async function mark(classNum, studentId, cell) {
            if (cell.classList.contains('present')) return; // Already marked

            cell.classList.add('present');
            cell.innerText = "Saving...";

            try {
                await fetch(API_URL, {
                    method: "POST",
                    mode: "no-cors", // Required for Google Scripts sometimes
                    body: JSON.stringify({
                        class: classNum,
                        id: studentId,
                        status: "Present"
                    })
                });
                cell.innerText = studentId;
                document.getElementById('status').innerText = `Saved: ${studentId} for Class ${classNum}`;
            } catch (err) {
                cell.classList.remove('present');
                cell.innerText = studentId;
                alert("Check internet connection!");
            }
        }

        function renderTable() {
            const tbody = document.getElementById('attendance-body');
            tbody.innerHTML = state.students.map(sid => `
                <tr class="border-b border-gray-800">
                    <td class="p-3 bg-gray-800 font-bold border-r border-gray-700">${sid}</td>
                    ${Array.from({length: 25}, (_, i) => {
                        const cNum = i + 1;
                        const isPresent = state.attendance[cNum]?.[sid];
                        return `
                            <td onclick="mark(${cNum}, '${sid}', this)" 
                                class="id-cell p-2 ${isPresent ? 'present' : ''}">
                                ${sid}
                            </td>`;
                    }).join('')}
                </tr>
            `).join('');
        }

        init();
    </script>
</body>
</html>
